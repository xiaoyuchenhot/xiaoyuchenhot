openapi: 3.0.3
info:
  title: OpenText Core Document Upload
  version: 1.0.0
servers:
  - url: https://core.opentext.com
paths:
  /api/v3/documents?collisionStrategy=overwrite:
    post:
      operationId: uploadDocument
      summary: Upload a document to a folder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - parentId
                - file
              properties:
                parentId:
                  type: string
                  description: Destination folder ID
                file:
                  type: string
                  format: binary
                  description: File to upload
      responses:
        '200':
          description: Document uploaded successfully
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Folder not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
